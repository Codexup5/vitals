[build]
target = "index.html"
dist = "dist"

[serve]
addresses = ["127.0.0.1"]
port = 3000

# The stylesheet is SCSS compiled by grass in xtask: no Node and no sass binary in the build
[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["xtask", "styles"]

[watch]
ignore = ["assets/app.css", "dist"]
