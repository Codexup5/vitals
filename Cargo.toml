[workspace]
resolver = "3"
members = ["src-tauri", "crates/vitals-ipc", "crates/vitals-ui", "xtask"]

[workspace.package]
version = "0.0.0"
authors = ["Codexup5"]
license = "MIT"
repository = "https://github.com/Codexup5/vitals"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vitals-ipc = { path = "crates/vitals-ipc" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

