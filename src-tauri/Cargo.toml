[package]
name = "vitals"
version = "0.0.0"
description = "Local Windows PC health panel"
authors = ["Codexup5"]
license = "MIT"
repository = "https://github.com/Codexup5/vitals"
edition = "2024"
rust-version = "1.85"

[lib]
name = "vitals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
