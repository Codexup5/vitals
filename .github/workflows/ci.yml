name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          # a self-hosted runner gets its own pnpm and store: the default ~/setup-pnpm is shared and parallel jobs break it
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
          package-manager-cache: ${{ !vars.CI_RUNNER }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # kit.json "tests": the e2e job runs only when it is on
      - id: tests
        run: node scripts/ci-tests.mjs

  e2e:
    if: ${{ needs.verify.outputs.tests == 'on' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
          package-manager-cache: ${{ !vars.CI_RUNNER }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # a free port: the runners of one PC run jobs in parallel
      - run: node scripts/ci-port.mjs
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  commitlint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
          package-manager-cache: ${{ !vars.CI_RUNNER }}
      - run: pnpm install --frozen-lockfile
      # node prints the title the same way in bash on Linux and in PowerShell on a self-hosted Windows runner
      - run: node -e "process.stdout.write(process.env.PR_TITLE)" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
