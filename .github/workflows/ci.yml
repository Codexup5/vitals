name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # the PC runner keeps the Rust build between jobs: checkout cleans ignored files, target/ included
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/vitals-target" >> "$GITHUB_ENV"
      - name: WebAssembly target and Trunk
        run: |
          rustup target add wasm32-unknown-unknown
          trunk --version || cargo install trunk --version 0.21.14 --locked
      - run: cargo fmt --all -- --check
      - run: cargo xtask check
      # the core embeds the built window: tauri-build needs crates/vitals-ui/dist before clippy and tests
      - name: Build the window
        working-directory: crates/vitals-ui
        run: trunk build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p vitals-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked

  commits:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/vitals-target" >> "$GITHUB_ENV"
      - run: cargo xtask header "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: cargo xtask commits "origin/${{ github.base_ref }}..HEAD"
